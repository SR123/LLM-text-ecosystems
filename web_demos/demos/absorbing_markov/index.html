<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Absorbing Markov Demo</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <header class="hero"><h1>Absorbing Markov Survival Demo</h1><p>Compare base and survival-conditioned chains.</p></header>
  <section class="panel">
    <div class="controls">
      <div><label>P(0→0)</label><input id="p00" type="number" value="0.7" min="0" max="1" step="0.05" /></div>
      <div><label>P(0→1)</label><input id="p01" type="number" value="0.2" min="0" max="1" step="0.05" /></div>
      <div><label>P(1→0)</label><input id="p10" type="number" value="0.2" min="0" max="1" step="0.05" /></div>
      <div><label>Horizon r</label><input id="r" type="number" value="8" min="1" max="40" /></div>
    </div>
    <p><button id="run">Compute</button></p>
    <pre id="out"></pre>
  </section>
<script>
function normalizeRow(a, b, c) {
  const s = a + b + c;
  if (s <= 0) return [1, 0, 0];
  return [a / s, b / s, c / s];
}

function matVecMul(P, v) {
  return P.map(row => row.reduce((acc, x, i) => acc + x * v[i], 0));
}

function run() {
  const p00 = Number(document.getElementById('p00').value);
  const p01 = Number(document.getElementById('p01').value);
  const p10 = Number(document.getElementById('p10').value);
  const r = Number(document.getElementById('r').value);

  const row0 = normalizeRow(p00, p01, Math.max(0, 1 - p00 - p01));
  const row1 = normalizeRow(p10, Math.max(0, 1 - p10 - 0.2), 0.2);
  const P = [row0, row1, [0, 0, 1]];

  let h = [1, 1, 0];
  for (let i = 0; i < r; i++) {
    h = matVecMul(P, h);
    h[2] = 0;
  }

  const out = { P, horizon: r, survival_h: h };
  document.getElementById('out').textContent = JSON.stringify(out, null, 2);
}

document.getElementById('run').addEventListener('click', run);
run();
</script>
</body>
</html>
