paths:
  root_outputs_dir: GitHub/data/outputs/transformer_rescue_round1
  processed_dir: GitHub/data/processed/transformer_rescue_round1
  figures_paper_dir: GitHub/figures/paper_main
  figures_appendix_dir: GitHub/figures/appendix
  db_path: GitHub/data/databases/experiment_index.sqlite

corpus:
  split_dir: GitHub/corpora/splits/conan_doyle

configs:
  tokenizer_config_path: GitHub/configs/tokenizer_conan_doyle_rescue_round1.yaml
  selected_decoding_config_path: GitHub/configs/selected_decoding_rescue_round1.yaml

model:
  d_model: 192
  n_heads: 4
  n_layers: 3
  d_ff: 768
  context_len: 256
  dropout: 0.1
  tie_weights: true
  bias: true
  max_seq_len: 256

training:
  batch_size: 32
  context_len: 256
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_steps: 5000
  eval_interval: 200
  eval_batches: 50
  warmup_steps: 100
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  early_stopping_patience: 8
  save_interval: 500
  seed: 12345
  device_preference: mps_or_cpu

student_training:
  batch_size: 24
  context_len: 256
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_steps: 2500
  eval_interval: 200
  eval_batches: 30
  warmup_steps: 100
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  early_stopping_patience: 6
  save_interval: 400
  seed: 23456
  device_preference: mps_or_cpu

environments:
  pilot_total_tokens: 100000
  full_total_tokens: 250000
  prompt_len: 64
  generation_prompt_count: 512
  evaluation_prompt_count: 512
  neutral_temperature: 1.0
  neutral_top_k: null
  neutral_top_p: 0.95
  max_new_tokens_per_prompt: 64
  checkpoint_interval_prompts: 20

evaluation:
  pilot_prompt_count: 256
  full_prompt_count: 512
  continuation_tokens: 32
  heldout_eval_batches: 40

seeds:
  master: 12345
  prompts: 22334
  environments: 33445
  students: 44556

rescue:
  failed_run_source_dir: GitHub/data/outputs/transformer_conan_doyle
  failed_archive_dir: GitHub/data/outputs/transformer_conan_doyle/failed_run_01
  failed_diagnostics_dir: GitHub/data/outputs/diagnostics
  tokenizer_candidates:
    - name: bpe_1000
      model_type: bpe
      vocab_size: 1000
      character_coverage: 1.0
    - name: bpe_2000
      model_type: bpe
      vocab_size: 2000
      character_coverage: 1.0
    - name: unigram_1000
      model_type: unigram
      vocab_size: 1000
      character_coverage: 1.0
  tokenizer_eval_training:
    batch_size: 16
    context_len: 128
    learning_rate: 4.0e-4
    weight_decay: 0.0
    max_steps: 140
    eval_interval: 35
    eval_batches: 8
    warmup_steps: 20
  prompt_quality_count: 32
  gates:
    tiny_overfit_min_accuracy: 0.55
    top_p_max_repeated_span_rate: 0.45
    top_p_min_unique_fraction: 0.20
    selected_max_repeated_span_delta: 0.10
    selected_min_unique_fraction_delta: -0.12
    selected_max_entropy_drop: 1.0
    selected_max_repetition_delta: 0.08
